name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Нативного lock в S3 нет, поэтому параллельные запуски запрещены.
concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_VERSION: "1.12.2"
  YC_SERVICE_ACCOUNT_KEY_FILE: /tmp/yc-key.json
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_KEY }}
  AWS_DEFAULT_REGION: ru-central1

jobs:
  plan:
    name: fmt / validate / plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - name: Записать ключ сервисного аккаунта и SSH-ключ
        run: |
          printf '%s' '${{ secrets.YC_SA_KEY_JSON }}' > "$YC_SERVICE_ACCOUNT_KEY_FILE"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}' > "$HOME/.ssh/id_ed25519.pub"
          chmod 600 "$HOME/.ssh/id_ed25519.pub"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Форматирование
        run: terraform fmt -check -recursive

      - name: Инициализация
        run: terraform init -input=false

      - name: Валидация
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Показать plan
        run: terraform show -no-color tfplan

      - name: Комментарий с планом в PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan\n\n```hcl\n' + plan + '\n```'
            });
        continue-on-error: true

      - name: Сохранить plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/tfplan
          retention-days: 5

  apply:
    name: apply (main)
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - name: Записать ключ сервисного аккаунта и SSH-ключ
        run: |
          printf '%s' '${{ secrets.YC_SA_KEY_JSON }}' > "$YC_SERVICE_ACCOUNT_KEY_FILE"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}' > "$HOME/.ssh/id_ed25519.pub"
          chmod 600 "$HOME/.ssh/id_ed25519.pub"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Инициализация
        run: terraform init -input=false

      - name: Применение
        run: terraform apply -input=false -auto-approve

# ClusterIssuer для Let's Encrypt. HTTP-01 challenge решается через ingress-nginx.
# Включается после того, как домен указывает на IP сетевого балансировщика.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com # заменить на реальный email
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
